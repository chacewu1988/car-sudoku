<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>快乐交通工具数独</title>
    <style>
        :root {
            --primary-color: #ffcc00;
            --bg-color: #e0f7fa;
            --grid-bg: #8bc34a;
        }
        
        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent; 
            margin: 0; 
            padding: 0; 
        }

        body {
            font-family: 'Comic Sans MS', 'Microsoft YaHei', cursive;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
            user-select: none;
            overflow-x: hidden;
        }

        h1 { 
            color: #ff5722; 
            text-shadow: 1px 1px #fff; 
            margin: 10px 0; 
            font-size: clamp(1.2rem, 5vw, 1.8rem);
        }

        /* 顶部导航区 */
        .mode-selector {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 15px;
            max-width: 500px;
        }
        
        button {
            padding: 8px 14px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 12px;
            background: white;
            box-shadow: 0 3px #ccc;
            font-weight: bold;
        }
        button.active { background: #ff9800; color: white; box-shadow: 0 3px #e65100; }
        .reset-btn { background: #81d4fa; }

        /* 核心修复：强制等比正方形网格容器 */
        .sudoku-container {
            width: 100%;
            max-width: 450px; /* 限制最大尺寸，防止在大屏iPad上过大 */
            aspect-ratio: 1 / 1; /* 容器本身保持正方形 */
            background: var(--grid-bg);
            padding: 8px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            display: flex;
        }

        .sudoku-grid {
            display: grid;
            gap: 4px;
            width: 100%;
            height: 100%;
            /* 关键修复：强制行和列都平分空间 */
            grid-template-columns: repeat(var(--size, 5), 1fr);
            grid-template-rows: repeat(var(--size, 5), 1fr);
        }
        
        .cell {
            background: white;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            /* 确保内容不会撑开格子 */
            overflow: hidden; 
        }

        /* 图标大小根据格子动态缩放 */
        .cell span {
            font-size: calc(80vw / var(--size, 5) * 0.5); 
        }
        @media (min-width: 500px) {
            .cell span { font-size: calc(450px / var(--size, 5) * 0.6); }
        }

        .cell.fixed { background: #f1f8e9; }
        .cell.user-filled { color: #1976d2; animation: pop 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .cell.error { background: #ffcdd2; animation: shake 0.3s; }
        
        /* 底部选择器 */
        .car-picker {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            width: 100%;
            max-width: 500px;
            padding-bottom: 20px;
        }
        
        .car-option {
            font-size: 40px;
            padding: 10px;
            border: 3px solid transparent;
            border-radius: 20px;
            background: white;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .car-option.selected { 
            border-color: #ff5722; 
            transform: scale(1.15);
            box-shadow: 0 6px 12px rgba(255,87,34,0.3);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        @keyframes pop {
            0% { transform: scale(0.5); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <h1>🏎️ 南星的交通工具数独 🚀</h1>

    <div class="mode-selector" id="modeSelector"></div>

    <div class="sudoku-container">
        <div id="grid" class="sudoku-grid"></div>
    </div>

    <div id="picker" class="car-picker"></div>

    <script>
        const ALL_ELEMENTS = ["🏎️", "🚌", "🚑", "🚜", "🚓", "🚚", "🚢", "🚀"];
        let currentSize = 5;
        let selectedCarIdx = 0;
        let puzzle = []; 

        function initModeButtons() {
            const container = document.getElementById('modeSelector');
            for (let i = 3; i <= 8; i++) {
                const btn = document.createElement('button');
                btn.innerText = i + '格';
                btn.id = 'btn' + i;
                btn.onclick = () => changeMode(i);
                container.appendChild(btn);
            }
            const resetBtn = document.createElement('button');
            resetBtn.innerText = '🔄 重玩';
            resetBtn.className = 'reset-btn';
            resetBtn.onclick = () => resetGame();
            container.appendChild(resetBtn);
        }

        function changeMode(size) {
            currentSize = size;
            document.documentElement.style.setProperty('--size', size);
            for (let i = 3; i <= 8; i++) {
                const btn = document.getElementById('btn' + i);
                if(btn) btn.className = (i === size ? 'active' : '');
            }
            selectedCarIdx = 0;
            resetGame();
        }

        function resetGame() {
            generateSudoku(currentSize);
            renderGrid();
            renderPicker();
        }

        function generateSudoku(size) {
            const board = Array.from({ length: size }, () => Array(size).fill(0));
            const nums = Array.from({length: size}, (_, i) => i + 1);
            const shuffle = (array) => [...array].sort(() => Math.random() - 0.5);
            const baseRow = shuffle(nums);
            
            // 步长算法，确保行列不重复
            let step = 1;
            if (size === 4 || size === 6) step = 2;
            if (size === 8) step = 3;

            for (let r = 0; r < size; r++) {
                let offset = r * step;
                if (size % 2 === 0) offset += Math.floor(r / (size/step)); 
                for (let c = 0; c < size; c++) {
                    board[r][c] = baseRow[(c + offset) % size];
                }
            }

            const totalCells = size * size;
            let keepCount = Math.floor(totalCells * (size < 5 ? 0.4 : 0.3));
            const indices = shuffle(Array.from({length: totalCells}, (_, i) => i));
            
            puzzle = Array.from({ length: size }, () => Array(size).fill(null));
            for (let i = 0; i < keepCount; i++) {
                const idx = indices[i];
                const r = Math.floor(idx / size);
                const c = idx % size;
                puzzle[r][c] = { val: board[r][c], fixed: true };
            }
        }

        function renderGrid() {
            const gridEl = document.getElementById('grid');
            gridEl.innerHTML = '';
            
            for(let r=0; r<currentSize; r++) {
                for(let c=0; c<currentSize; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const data = puzzle[r][c];
                    if(data) {
                        const span = document.createElement('span');
                        span.innerText = ALL_ELEMENTS[data.val - 1];
                        cell.appendChild(span);
                        if(data.fixed) cell.classList.add('fixed');
                        else cell.classList.add('user-filled');
                    }
                    cell.onclick = () => fillCell(r, c);
                    gridEl.appendChild(cell);
                }
            }
        }

        function renderPicker() {
            const pickerEl = document.getElementById('picker');
            pickerEl.innerHTML = '';
            for(let i=0; i<currentSize; i++) {
                const opt = document.createElement('div');
                opt.className = `car-option ${i === selectedCarIdx ? 'selected' : ''}`;
                opt.innerText = ALL_ELEMENTS[i];
                opt.onclick = () => {
                    selectedCarIdx = i;
                    renderPicker();
                };
                pickerEl.appendChild(opt);
            }
        }

        function fillCell(r, c) {
            if(puzzle[r][c]?.fixed) return;
            const newVal = selectedCarIdx + 1;
            const cells = document.querySelectorAll('.cell');
            const targetCell = cells[r * currentSize + c];

            if(hasConflict(r, c, newVal)) {
                targetCell.classList.add('error');
                setTimeout(() => targetCell.classList.remove('error'), 400);
                return;
            }

            if (puzzle[r][c]?.val === newVal) {
                puzzle[r][c] = null;
            } else {
                puzzle[r][c] = { val: newVal, fixed: false };
            }
            renderGrid();
            checkWin();
        }

        function hasConflict(r, c, val) {
            for(let i=0; i<currentSize; i++) {
                if(i !== c && puzzle[r][i]?.val === val) return true;
                if(i !== r && puzzle[i][c]?.val === val) return true;
            }
            return false;
        }

        function checkWin() {
            let filled = 0;
            for(let r=0; r<currentSize; r++) {
                for(let c=0; c<currentSize; c++) {
                    if(puzzle[r][c] !== null) filled++;
                }
            }
            if(filled === currentSize * currentSize) {
                setTimeout(() => alert("🎊 滴滴！太棒了，所有车辆都停好啦！"), 200);
            }
        }

        initModeButtons();
        changeMode(5);
    </script>
</body>
</html>
