<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>快乐小车库 - 幼儿数独</title>
    <style>
        :root {
            --primary-color: #ffcc00;
            --bg-color: #e0f7fa;
        }
        body {
            font-family: 'Comic Sans MS', 'Microsoft YaHei', cursive;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            margin: 0;
            user-select: none;
            touch-action: manipulation;
        }
        h1 { color: #ff5722; text-shadow: 2px 2px #fff; margin: 10px 0; font-size: 24px; }
        .controls { margin-bottom: 15px; }
        button {
            padding: 8px 18px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 12px;
            background: var(--primary-color);
            box-shadow: 0 4px #b89200;
            margin: 0 5px;
            font-weight: bold;
        }
        button.active { background: #ff9800; color: white; box-shadow: 0 4px #e65100; }
        
        .sudoku-grid {
            display: grid;
            background: #8bc34a;
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            gap: 5px;
        }
        .cell {
            width: 58px;
            height: 58px;
            background: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            position: relative;
            transition: background 0.2s;
        }
        /* 6格模式下的宫格边框增强 */
        .grid-6 .cell:nth-child(3n) { border-right: 3px solid #689f38; }
        .grid-6 .cell:nth-child(n+19):nth-child(-n+36) { border-top: 3px solid #689f38; }

        .cell.fixed { background: #f1f8e9; cursor: default; }
        .cell.user-filled { color: #1976d2; animation: pop 0.2s; }
        .cell.error { background: #ffcdd2; animation: shake 0.3s; }
        
        .car-picker {
            margin-top: 25px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            background: white;
            padding: 15px;
            border-radius: 25px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .car-option {
            font-size: 38px;
            padding: 5px;
            border: 3px solid transparent;
            border-radius: 15px;
            cursor: pointer;
        }
        .car-option.selected { border-color: #ff5722; background: #fff3e0; transform: scale(1.1); }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
        @keyframes pop {
            0% { transform: scale(0.8); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <h1>🏎️ 快乐小车库 🚌</h1>

    <div class="controls">
        <button id="btn5" onclick="changeMode(5)" class="active">5格模式</button>
        <button id="btn6" onclick="changeMode(6)">6格模式</button>
        <button onclick="resetGame()" style="background:#81d4fa; box-shadow: 0 4px #0288d1;">新游戏</button>
    </div>

    <div id="grid" class="sudoku-grid"></div>

    <div id="picker" class="car-picker"></div>

    <script>
        const CARS = ["🏎️", "🚌", "🚑", "🚜", "🚓", "🚚"];
        let currentSize = 5;
        let selectedCarIdx = 0;
        let puzzle = []; // 玩家看到的网格

        function changeMode(size) {
            currentSize = size;
            document.getElementById('btn5').className = size === 5 ? 'active' : '';
            document.getElementById('btn6').className = size === 6 ? 'active' : '';
            resetGame();
        }

        function resetGame() {
            generateSudoku(currentSize);
            renderGrid();
            renderPicker();
        }

        function generateSudoku(size) {
            // 1. 生成一个完整合法的底盘
            const board = Array.from({ length: size }, () => Array(size).fill(0));
            const nums = Array.from({length: size}, (_, i) => i + 1);
            
            // 使用简单的有效位移生成基础盘面
            const shuffle = (array) => array.sort(() => Math.random() - 0.5);
            const baseRow = shuffle([...nums]);
            
            for (let r = 0; r < size; r++) {
                let offset;
                if (size === 5) offset = r * 2; // 5是质数，位移2可保证每行不重
                if (size === 6) offset = Math.floor(r / 2) + (r % 2) * 3; 
                
                for (let c = 0; c < size; c++) {
                    board[r][c] = baseRow[(c + offset) % size];
                }
            }

            // 2. 挖洞 (减少初始车辆数量)
            // 5格模式保留 9 个，6格模式保留 13 个
            const totalCells = size * size;
            const keepCount = size === 5 ? 9 : 13; 
            const indices = shuffle(Array.from({length: totalCells}, (_, i) => i));
            
            puzzle = Array.from({ length: size }, () => Array(size).fill(null));
            for (let i = 0; i < keepCount; i++) {
                const idx = indices[i];
                const r = Math.floor(idx / size);
                const c = idx % size;
                puzzle[r][c] = { val: board[r][c], fixed: true };
            }
        }

        function renderGrid() {
            const gridEl = document.getElementById('grid');
            gridEl.className = `sudoku-grid grid-${currentSize}`;
            gridEl.style.gridTemplateColumns = `repeat(${currentSize}, 1fr)`;
            gridEl.innerHTML = '';
            
            for(let r=0; r<currentSize; r++) {
                for(let c=0; c<currentSize; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const data = puzzle[r][c];
                    
                    if(data) {
                        cell.innerText = CARS[data.val - 1];
                        if(data.fixed) cell.classList.add('fixed');
                        else cell.classList.add('user-filled');
                    }
                    
                    cell.onclick = () => fillCell(r, c);
                    gridEl.appendChild(cell);
                }
            }
        }

        function renderPicker() {
            const pickerEl = document.getElementById('picker');
            pickerEl.innerHTML = '';
            for(let i=0; i<currentSize; i++) {
                const opt = document.createElement('div');
                opt.className = `car-option ${i === selectedCarIdx ? 'selected' : ''}`;
                opt.innerText = CARS[i];
                opt.onclick = () => {
                    selectedCarIdx = i;
                    renderPicker();
                };
                pickerEl.appendChild(opt);
            }
        }

        function fillCell(r, c) {
            if(puzzle[r][c]?.fixed) return;
            
            const newVal = selectedCarIdx + 1;
            const cells = document.querySelectorAll('.cell');
            const targetCell = cells[r * currentSize + c];

            // 冲突检查
            if(hasConflict(r, c, newVal)) {
                targetCell.classList.add('error');
                setTimeout(() => targetCell.classList.remove('error'), 400);
                return;
            }

            // 如果点击已有的车则清除，否则填入
            if (puzzle[r][c]?.val === newVal) {
                puzzle[r][c] = null;
            } else {
                puzzle[r][c] = { val: newVal, fixed: false };
            }
            
            renderGrid();
            checkWin();
        }

        function hasConflict(r, c, val) {
            for(let i=0; i<currentSize; i++) {
                if(i !== c && puzzle[r][i]?.val === val) return true;
                if(i !== r && puzzle[i][c]?.val === val) return true;
            }
            if(currentSize === 6) {
                let boxR = Math.floor(r / 2) * 2;
                let boxC = Math.floor(c / 3) * 3;
                for(let i=boxR; i<boxR+2; i++) {
                    for(let j=boxC; j<boxC+3; j++) {
                        if(i === r && j === c) continue;
                        if(puzzle[i][j]?.val === val) return true;
                    }
                }
            }
            return false;
        }

        function checkWin() {
            let count = 0;
            for(let r=0; r<currentSize; r++) {
                for(let c=0; c<currentSize; c++) {
                    if(puzzle[r][c] !== null) count++;
                }
            }
            if(count === currentSize * currentSize) {
                setTimeout(() => alert("🎉 恭喜！你把所有的小车都停好啦！"), 200);
            }
        }

        resetGame();
    </script>
</body>
</html>
