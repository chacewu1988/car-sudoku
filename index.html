<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>快乐交通工具数独</title>
    <style>
        :root {
            --primary-color: #ffcc00;
            --bg-color: #e0f7fa;
        }
        body {
            font-family: 'Comic Sans MS', 'Microsoft YaHei', cursive;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px;
            margin: 0;
            user-select: none;
            touch-action: manipulation;
        }
        h1 { color: #ff5722; text-shadow: 2px 2px #fff; margin: 5px 0; font-size: 22px; }
        
        .mode-selector {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 5px;
            margin-bottom: 10px;
            background: white;
            padding: 8px;
            border-radius: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        
        button {
            padding: 6px 10px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background: #eee;
            transition: 0.2s;
        }
        button.active { background: #ff9800; color: white; font-weight: bold; }
        .reset-btn { background: #81d4fa; margin-left: 5px; }

        .sudoku-container {
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: center;
        }

        .sudoku-grid {
            display: grid;
            background: #8bc34a;
            padding: 6px;
            border-radius: 10px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.15);
            gap: 3px;
        }
        
        .cell {
            background: white;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            aspect-ratio: 1 / 1;
        }

        .cell.fixed { background: #f1f8e9; }
        .cell.user-filled { color: #1976d2; animation: pop 0.2s; }
        .cell.error { background: #ffcdd2; animation: shake 0.3s; }
        
        .car-picker {
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            background: white;
            padding: 12px;
            border-radius: 20px;
            width: 95%;
            max-width: 450px;
        }
        .car-option {
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 10px;
            transition: transform 0.1s;
        }
        .car-option.selected { border-color: #ff5722; background: #fff3e0; transform: scale(1.1); }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-3px); }
            75% { transform: translateX(3px); }
        }
        @keyframes pop {
            0% { transform: scale(0.8); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <h1>🚀 南星专属交通工具大挑战 🚢</h1>

    <div class="mode-selector" id="modeSelector">
        </div>

    <div class="sudoku-container">
        <div id="grid" class="sudoku-grid"></div>
    </div>

    <div id="picker" class="car-picker"></div>

    <script>
        // 扩展元素池，支持到8格
        const ALL_ELEMENTS = ["🏎️", "🚌", "🚑", "🚜", "🚓", "🚚", "🚢", "🚀"];
        let currentSize = 5;
        let selectedCarIdx = 0;
        let puzzle = []; 

        // 初始化模式选择按钮
        function initModeButtons() {
            const container = document.getElementById('modeSelector');
            for (let i = 3; i <= 8; i++) {
                const btn = document.createElement('button');
                btn.innerText = i + '格';
                btn.id = 'btn' + i;
                btn.onclick = () => changeMode(i);
                container.appendChild(btn);
            }
            const resetBtn = document.createElement('button');
            resetBtn.innerText = '刷新地图';
            resetBtn.className = 'reset-btn';
            resetBtn.onclick = () => resetGame();
            container.appendChild(resetBtn);
        }

        function changeMode(size) {
            currentSize = size;
            for (let i = 3; i <= 8; i++) {
                document.getElementById('btn' + i).className = (i === size ? 'active' : '');
            }
            selectedCarIdx = 0;
            resetGame();
        }

        function resetGame() {
            generateSudoku(currentSize);
            renderGrid();
            renderPicker();
        }

        function generateSudoku(size) {
            const board = Array.from({ length: size }, () => Array(size).fill(0));
            const nums = Array.from({length: size}, (_, i) => i + 1);
            
            const shuffle = (array) => array.sort(() => Math.random() - 0.5);
            const baseRow = shuffle([...nums]);
            
            // 改进的生成逻辑，确保所有尺寸均无冲突
            // 使用与尺寸互质的位移步长
            let step = 1;
            if (size === 4) step = 2; 
            if (size === 6) step = 2;
            if (size === 8) step = 3;

            for (let r = 0; r < size; r++) {
                let offset = r * step;
                // 针对偶数尺寸的额外位移修正，防止列重复
                if (size % 2 === 0) offset += Math.floor(r / (size/step)); 
                
                for (let c = 0; c < size; c++) {
                    board[r][c] = baseRow[(c + offset) % size];
                }
            }

            // 动态计算挖洞数量：保留约 30%-40%
            const totalCells = size * size;
            let keepCount = Math.floor(totalCells * 0.35);
            if(size < 5) keepCount = Math.floor(totalCells * 0.45); // 小尺寸多留一点

            const indices = shuffle(Array.from({length: totalCells}, (_, i) => i));
            puzzle = Array.from({ length: size }, () => Array(size).fill(null));
            for (let i = 0; i < keepCount; i++) {
                const idx = indices[i];
                const r = Math.floor(idx / size);
                const c = idx % size;
                puzzle[r][c] = { val: board[r][c], fixed: true };
            }
        }

        function renderGrid() {
            const gridEl = document.getElementById('grid');
            const screenWidth = window.innerWidth;
            // 动态计算格子大小
            const containerWidth = Math.min(screenWidth - 40, 450);
            const cellSize = Math.floor(containerWidth / currentSize) - 4;

            gridEl.style.gridTemplateColumns = `repeat(${currentSize}, 1fr)`;
            gridEl.innerHTML = '';
            
            for(let r=0; r<currentSize; r++) {
                for(let c=0; c<currentSize; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.style.width = cellSize + 'px';
                    cell.style.height = cellSize + 'px';
                    cell.style.fontSize = (cellSize * 0.6) + 'px';
                    
                    const data = puzzle[r][c];
                    if(data) {
                        cell.innerText = ALL_ELEMENTS[data.val - 1];
                        if(data.fixed) cell.classList.add('fixed');
                        else cell.classList.add('user-filled');
                    }
                    
                    cell.onclick = () => fillCell(r, c);
                    gridEl.appendChild(cell);
                }
            }
        }

        function renderPicker() {
            const pickerEl = document.getElementById('picker');
            pickerEl.innerHTML = '';
            const itemSize = currentSize > 6 ? 45 : 55;
            for(let i=0; i<currentSize; i++) {
                const opt = document.createElement('div');
                opt.className = `car-option ${i === selectedCarIdx ? 'selected' : ''}`;
                opt.style.fontSize = (itemSize * 0.8) + 'px';
                opt.innerText = ALL_ELEMENTS[i];
                opt.onclick = () => {
                    selectedCarIdx = i;
                    renderPicker();
                };
                pickerEl.appendChild(opt);
            }
        }

        function fillCell(r, c) {
            if(puzzle[r][c]?.fixed) return;
            const newVal = selectedCarIdx + 1;
            const cells = document.querySelectorAll('.cell');
            const targetCell = cells[r * currentSize + c];

            if(hasConflict(r, c, newVal)) {
                targetCell.classList.add('error');
                setTimeout(() => targetCell.classList.remove('error'), 400);
                return;
            }

            if (puzzle[r][c]?.val === newVal) {
                puzzle[r][c] = null;
            } else {
                puzzle[r][c] = { val: newVal, fixed: false };
            }
            renderGrid();
            checkWin();
        }

        function hasConflict(r, c, val) {
            for(let i=0; i<currentSize; i++) {
                if(i !== c && puzzle[r][i]?.val === val) return true;
                if(i !== r && puzzle[i][c]?.val === val) return true;
            }
            return false;
        }

        function checkWin() {
            let filled = 0;
            for(let r=0; r<currentSize; r++) {
                for(let c=0; c<currentSize; c++) {
                    if(puzzle[r][c] !== null) filled++;
                }
            }
            if(filled === currentSize * currentSize) {
                setTimeout(() => alert("🎊 太棒了！所有的交通工具都归位了！"), 200);
            }
        }

        window.onresize = renderGrid; // 屏幕旋转或调整大小时重新计算布局
        initModeButtons();
        changeMode(5);
    </script>
</body>
</html>
