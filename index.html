<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>快乐小车库 - 幼儿数独</title>
    <style>
        :root {
            --primary-color: #ffcc00;
            --bg-color: #e0f7fa;
        }
        body {
            font-family: 'Comic Sans MS', 'Microsoft YaHei', cursive;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 20px;
            margin: 0;
            user-select: none;
            touch-action: manipulation;
        }
        h1 { color: #ff5722; text-shadow: 2px 2px #fff; margin: 10px 0; font-size: 24px; }
        .controls { margin-bottom: 15px; }
        button {
            padding: 8px 15px;
            font-size: 16px;
            cursor: pointer;
            border: none;
            border-radius: 12px;
            background: var(--primary-color);
            box-shadow: 0 4px #b89200;
            margin: 0 5px;
        }
        button.active { background: #ff9800; color: white; box-shadow: 0 4px #e65100; }
        
        .sudoku-grid {
            display: grid;
            background: #8bc34a;
            padding: 10px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            gap: 5px;
        }
        .cell {
            width: 55px;
            height: 55px;
            background: white;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            position: relative;
        }
        /* 6格模式下的宫格边框增强 */
        .grid-6 .cell:nth-child(3n) { border-right: 3px solid #689f38; }
        .grid-6 .cell:nth-child(n+19):nth-child(-n+36) { border-top: 3px solid #689f38; }

        .cell.fixed { background: #f1f8e9; color: #000; }
        .cell.user-filled { color: #1976d2; }
        .cell.error { background: #ffcdd2; animation: shake 0.3s; }
        
        .car-picker {
            margin-top: 20px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            background: white;
            padding: 15px;
            border-radius: 25px;
            width: 90%;
            max-width: 400px;
        }
        .car-option {
            font-size: 35px;
            padding: 5px;
            border: 3px solid transparent;
            border-radius: 15px;
            transition: transform 0.1s;
        }
        .car-option.selected { border-color: #ff5722; transform: scale(1.2); }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }
    </style>
</head>
<body>

    <h1>🏎️ 快乐小车库 🚌</h1>

    <div class="controls">
        <button id="btn5" onclick="changeMode(5)" class="active">5格模式</button>
        <button id="btn6" onclick="changeMode(6)">6格模式</button>
        <button onclick="resetGame()" style="background:#81d4fa; box-shadow: 0 4px #0288d1;">重玩</button>
    </div>

    <div id="grid" class="sudoku-grid"></div>

    <div id="picker" class="car-picker"></div>

    <script>
        const CARS = ["🏎️", "🚌", "🚑", "🚜", "🚓", "🚚"];
        let currentSize = 5;
        let selectedCarIdx = 0;
        let solution = [];
        let puzzle = [];

        function changeMode(size) {
            currentSize = size;
            document.getElementById('btn5').className = size === 5 ? 'active' : '';
            document.getElementById('btn6').className = size === 6 ? 'active' : '';
            resetGame();
        }

        function resetGame() {
            generateSudoku(currentSize);
            renderGrid();
            renderPicker();
        }

        // 生成合法的数独矩阵
        function generateSudoku(size) {
            const grid = Array.from({ length: size }, () => Array(size).fill(0));
            
            // 基础填充：行移动法
            let shift = (size === 6) ? [0, 2, 4, 1, 3, 5] : [0, 1, 2, 3, 4];
            let base = Array.from({length: size}, (_, i) => i + 1);
            // 随机打乱基础数字序列
            base.sort(() => Math.random() - 0.5);

            for (let r = 0; r < size; r++) {
                for (let c = 0; c < size; c++) {
                    grid[r][c] = base[(c + (size === 6 ? [0,3,1,4,2,5][r] : r)) % size];
                }
            }
            
            // 随机交换行和列（仅限同组内）来增加随机性
            shuffleGrid(grid, size);
            solution = JSON.parse(JSON.stringify(grid));
            
            // 挖洞：根据难度保留部分数字
            puzzle = grid.map(row => row.map(val => Math.random() > 0.4 ? val : null));
        }

        function shuffleGrid(grid, size) {
            // 简单的行列交换逻辑
            for(let i=0; i<10; i++) {
                let r1 = Math.floor(Math.random() * size);
                let r2 = Math.floor(Math.random() * size);
                // 仅交换行不破坏横向规则，但在数独中需谨慎。此处由于是基础逻辑演示，采用行列置换。
                [grid[r1], grid[r2]] = [grid[r2], grid[r1]];
            }
        }

        function renderGrid() {
            const gridEl = document.getElementById('grid');
            gridEl.className = `sudoku-grid grid-${currentSize}`;
            gridEl.style.gridTemplateColumns = `repeat(${currentSize}, 1fr)`;
            gridEl.innerHTML = '';
            
            for(let r=0; r<currentSize; r++) {
                for(let c=0; c<currentSize; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const val = puzzle[r][c];
                    if(val !== null) {
                        cell.innerText = CARS[val - 1];
                        cell.classList.add('fixed');
                    }
                    cell.onclick = () => fillCell(r, c);
                    gridEl.appendChild(cell);
                }
            }
        }

        function renderPicker() {
            const pickerEl = document.getElementById('picker');
            pickerEl.innerHTML = '';
            for(let i=0; i<currentSize; i++) {
                const opt = document.createElement('div');
                opt.className = `car-option ${i === selectedCarIdx ? 'selected' : ''}`;
                opt.innerText = CARS[i];
                opt.onclick = () => {
                    selectedCarIdx = i;
                    renderPicker();
                };
                pickerEl.appendChild(opt);
            }
        }

        function fillCell(r, c) {
            // 如果是初始固定的车，不能修改
            const cells = document.querySelectorAll('.cell');
            const targetCell = cells[r * currentSize + c];
            if(targetCell.classList.contains('fixed')) return;
            
            const newVal = selectedCarIdx + 1;

            // 检查规则
            if(hasConflict(r, c, newVal)) {
                targetCell.classList.add('error');
                setTimeout(() => targetCell.classList.remove('error'), 300);
            } else {
                puzzle[r][c] = newVal;
                targetCell.innerText = CARS[selectedCarIdx];
                targetCell.classList.add('user-filled');
                checkWin();
            }
        }

        function hasConflict(r, c, val) {
            // 检查行
            for(let i=0; i<currentSize; i++) {
                if(i !== c && puzzle[r][i] === val) return true;
            }
            // 检查列
            for(let i=0; i<currentSize; i++) {
                if(i !== r && puzzle[i][c] === val) return true;
            }
            // 6格模式检查 2x3 区域
            if(currentSize === 6) {
                let boxR = Math.floor(r / 2) * 2;
                let boxC = Math.floor(c / 3) * 3;
                for(let i=boxR; i<boxR+2; i++) {
                    for(let j=boxC; j<boxC+3; j++) {
                        if(i === r && j === c) continue;
                        if(puzzle[i][j] === val) return true;
                    }
                }
            }
            return false;
        }

        function checkWin() {
            if(puzzle.every(row => row.every(cell => cell !== null))) {
                setTimeout(() => alert("🎉 太棒了！所有的车都停对位置了！"), 100);
            }
        }

        resetGame();
    </script>
</body>
</html>
