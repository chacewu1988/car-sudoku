<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>快乐交通工具数独</title>
    <style>
        :root {
            --primary-color: #ffcc00;
            --bg-color: #e0f7fa;
            --text-color: #333;
        }
        
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Comic Sans MS', 'Microsoft YaHei', cursive;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            user-select: none;
        }

        h1 { 
            color: #ff5722; 
            text-shadow: 1px 1px #fff; 
            margin: 5px 0; 
            font-size: clamp(1.2rem, 5vw, 1.8rem); /* 标题大小随屏幕自动调整 */
        }

        /* 顶部模式切换区 */
        .mode-selector {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 500px;
        }
        
        button {
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            background: white;
            box-shadow: 0 3px #ddd;
            transition: 0.1s;
        }
        button.active { background: #ff9800; color: white; box-shadow: 0 3px #e65100; }
        button:active { transform: translateY(2px); box-shadow: 0 1px #999; }
        .reset-btn { background: #81d4fa; }

        /* 核心游戏网格容器 */
        .sudoku-container {
            width: 100%;
            max-width: min(95vw, 500px); /* 宽度取屏幕宽度的95%或500px中的最小值 */
            margin: 0 auto;
        }

        .sudoku-grid {
            display: grid;
            background: #8bc34a;
            padding: 8px;
            border-radius: 12px;
            gap: 4px;
            width: 100%;
            aspect-ratio: 1 / 1; /* 保持正方形 */
        }
        
        .cell {
            background: white;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(20px, 6vw, 40px); /* 汽车图标随格子大小变化 */
            cursor: pointer;
            position: relative;
        }

        .cell.fixed { background: #f1f8e9; }
        .cell.user-filled { color: #1976d2; animation: pop 0.2s; }
        .cell.error { background: #ffcdd2; animation: shake 0.3s; }
        
        /* 底部汽车选择器 */
        .car-picker {
            margin-top: auto; /* 自动推到底部 */
            padding: 15px 5px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            width: 100%;
            max-width: 500px;
        }
        
        .car-option {
            font-size: clamp(30px, 8vw, 45px);
            padding: 8px;
            border: 3px solid transparent;
            border-radius: 15px;
            background: rgba(255,255,255,0.6);
            cursor: pointer;
            transition: 0.2s;
        }
        .car-option.selected { 
            border-color: #ff5722; 
            background: white; 
            transform: scale(1.1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-3px); }
            75% { transform: translateX(3px); }
        }
        @keyframes pop {
            0% { transform: scale(0.8); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <h1>🚀 快乐交通工具数独 🚢</h1>

    <div class="mode-selector" id="modeSelector"></div>

    <div class="sudoku-container">
        <div id="grid" class="sudoku-grid"></div>
    </div>

    <div id="picker" class="car-picker"></div>

    <script>
        const ALL_ELEMENTS = ["🏎️", "🚌", "🚑", "🚜", "🚓", "🚚", "🚢", "🚀"];
        let currentSize = 5;
        let selectedCarIdx = 0;
        let puzzle = []; 

        function initModeButtons() {
            const container = document.getElementById('modeSelector');
            for (let i = 3; i <= 8; i++) {
                const btn = document.createElement('button');
                btn.innerText = i + '格';
                btn.id = 'btn' + i;
                btn.onclick = () => changeMode(i);
                container.appendChild(btn);
            }
            const resetBtn = document.createElement('button');
            resetBtn.innerText = '🔄 重玩';
            resetBtn.className = 'reset-btn';
            resetBtn.onclick = () => resetGame();
            container.appendChild(resetBtn);
        }

        function changeMode(size) {
            currentSize = size;
            for (let i = 3; i <= 8; i++) {
                document.getElementById('btn' + i).className = (i === size ? 'active' : '');
            }
            selectedCarIdx = 0;
            resetGame();
        }

        function resetGame() {
            generateSudoku(currentSize);
            renderGrid();
            renderPicker();
        }

        function generateSudoku(size) {
            const board = Array.from({ length: size }, () => Array(size).fill(0));
            const nums = Array.from({length: size}, (_, i) => i + 1);
            const shuffle = (array) => array.sort(() => Math.random() - 0.5);
            const baseRow = shuffle([...nums]);
            
            let step = (size === 4 || size === 6) ? 2 : (size === 8 ? 3 : 1);

            for (let r = 0; r < size; r++) {
                let offset = r * step;
                if (size % 2 === 0) offset += Math.floor(r / (size/step)); 
                for (let c = 0; c < size; c++) {
                    board[r][c] = baseRow[(c + offset) % size];
                }
            }

            const totalCells = size * size;
            let keepCount = Math.floor(totalCells * (size < 5 ? 0.45 : 0.35));
            const indices = shuffle(Array.from({length: totalCells}, (_, i) => i));
            puzzle = Array.from({ length: size }, () => Array(size).fill(null));
            for (let i = 0; i < keepCount; i++) {
                const idx = indices[i];
                const r = Math.floor(idx / size);
                const c = idx % size;
                puzzle[r][c] = { val: board[r][c], fixed: true };
            }
        }

        function renderGrid() {
            const gridEl = document.getElementById('grid');
            gridEl.style.gridTemplateColumns = `repeat(${currentSize}, 1fr)`;
            gridEl.innerHTML = '';
            
            for(let r=0; r<currentSize; r++) {
                for(let c=0; c<currentSize; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const data = puzzle[r][c];
                    if(data) {
                        cell.innerText = ALL_ELEMENTS[data.val - 1];
                        if(data.fixed) cell.classList.add('fixed');
                        else cell.classList.add('user-filled');
                    }
                    cell.onclick = () => fillCell(r, c);
                    gridEl.appendChild(cell);
                }
            }
        }

        function renderPicker() {
            const pickerEl = document.getElementById('picker');
            pickerEl.innerHTML = '';
            for(let i=0; i<currentSize; i++) {
                const opt = document.createElement('div');
                opt.className = `car-option ${i === selectedCarIdx ? 'selected' : ''}`;
                opt.innerText = ALL_ELEMENTS[i];
                opt.onclick = () => {
                    selectedCarIdx = i;
                    renderPicker();
                };
                pickerEl.appendChild(opt);
            }
        }

        function fillCell(r, c) {
            if(puzzle[r][c]?.fixed) return;
            const newVal = selectedCarIdx + 1;
            const cells = document.querySelectorAll('.cell');
            const targetCell = cells[r * currentSize + c];

            if(hasConflict(r, c, newVal)) {
                targetCell.classList.add('error');
                setTimeout(() => targetCell.classList.remove('error'), 400);
                return;
            }

            if (puzzle[r][c]?.val === newVal) {
                puzzle[r][c] = null;
            } else {
                puzzle[r][c] = { val: newVal, fixed: false };
            }
            renderGrid();
            checkWin();
        }

        function hasConflict(r, c, val) {
            for(let i=0; i<currentSize; i++) {
                if(i !== c && puzzle[r][i]?.val === val) return true;
                if(i !== r && puzzle[i][c]?.val === val) return true;
            }
            return false;
        }

        function checkWin() {
            let filled = 0;
            for(let r=0; r<currentSize; r++) {
                for(let c=0; c<currentSize; c++) {
                    if(puzzle[r][c] !== null) filled++;
                }
            }
            if(filled === currentSize * currentSize) {
                setTimeout(() => alert("🎊 太棒了！任务完成！"), 200);
            }
        }

        initModeButtons();
        changeMode(5);
    </script>
</body>
</html>
